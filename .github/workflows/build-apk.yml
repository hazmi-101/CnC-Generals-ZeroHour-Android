name: build-apk

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform + NDK 27
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          echo "Pakai sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson autoconf automake libtool \
            pkg-config gperf nasm flex bison python3-jinja2

      - name: Get vcpkg (full clone, manifest needs baseline history)
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-${{ hashFiles('engine/vcpkg.json') }}

      # ---- WAJIB BERHASIL: engine (libmain.so) + SDL3/OpenAL/GameSpy via FetchContent ----
      - name: Configure engine
        run: |
          cmake -S engine -B engine/build/android-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            -DSAGE_USE_DX8=OFF \
            -DSAGE_USE_SDL3=ON \
            -DSAGE_USE_OPENAL=ON \
            -DSAGE_USE_MINIAUDIO=OFF \
            -DSAGE_USE_GLM=ON \
            -DSAGE_UPDATE_CHECK=OFF \
            -DRTS_CRASHDUMP_ENABLE=OFF \
            -DRTS_BUILD_OPTION_FFMPEG=ON \
            -DRTS_BUILD_OPTION_SAGE_PATCH=OFF \
            -DRTS_BUILD_GENERALS=OFF \
            -DRTS_BUILD_CORE_TOOLS=OFF \
            -DRTS_BUILD_ZEROHOUR_TOOLS=OFF

      - name: Patch GameSpy untuk Android (bionic tanpa pthread_cancel)
        run: |
          cat > /tmp/gs_android_compat.h <<'EOF'
          #ifndef GS_ANDROID_COMPAT_H
          #define GS_ANDROID_COMPAT_H
          #ifdef __ANDROID__
          #include <pthread.h>
          #include <signal.h>
          #include <string.h>
          #ifndef PTHREAD_CANCEL_ENABLE
          #define PTHREAD_CANCEL_ENABLE 0
          #define PTHREAD_CANCEL_DISABLE 1
          #define PTHREAD_CANCEL_DEFERRED 0
          #define PTHREAD_CANCEL_ASYNCHRONOUS 1
          #endif
          static inline void gs_cancel_handler(int sig) { (void)sig; pthread_exit(NULL); }
          static inline int gs_pthread_cancel(pthread_t t)
          {
              struct sigaction sa;
              memset(&sa, 0, sizeof(sa));
              sa.sa_handler = gs_cancel_handler;
              sigemptyset(&sa.sa_mask);
              sigaction(SIGUSR2, &sa, NULL);
              return pthread_kill(t, SIGUSR2);
          }
          #define pthread_cancel gs_pthread_cancel
          #define pthread_setcancelstate(a, b) ((void)(a), (void)(b), 0)
          #define pthread_setcanceltype(a, b) ((void)(a), (void)(b), 0)
          #define pthread_testcancel() ((void)0)
          #endif
          #endif
          EOF
          f=$(find engine/build/android-arm64 -iname gsplatformthread.c -print -quit)
          test -n "$f" || { echo "gsplatformthread.c tidak ditemukan"; exit 1; }
          echo "Patch: $f"
          cat /tmp/gs_android_compat.h "$f" > "$f.new"
          mv "$f.new" "$f"

      - name: Build engine
        run: |
          set -o pipefail
          cmake --build engine/build/android-arm64 --target z_generals -j4 -- -k 0 2>&1 | tee build.log

      - name: Ringkasan error (kalau build gagal)
        if: failure()
        run: |
          {
            echo "### Error build (maks 40 baris)"
            echo '```'
            grep -E "error:|FAILED:|CMake Error" build.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- BEST EFFORT: boleh gagal, build lanjut ----
      - name: Build DXVK (best effort)
        continue-on-error: true
        run: |
          git clone https://github.com/fbraz3/dxvk.git dxvk-src
          cd dxvk-src
          git checkout 46a3bc018bcae408d49d3c500e4e536a11f6789a
          git submodule update --init --recursive
          TC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          cat > android-cross.ini <<EOF
          [binaries]
          c = '$TC/aarch64-linux-android28-clang'
          cpp = '$TC/aarch64-linux-android28-clang++'
          ar = '$TC/llvm-ar'
          strip = '$TC/llvm-strip'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF
          meson setup build --cross-file android-cross.ini \
            -Ddxvk_native_wsi=sdl3 --buildtype=release
          ninja -C build src/d3d9/libdxvk_d3d9.so src/d3d8/libdxvk_d3d8.so

      - name: Stage native libs (skip yang hilang)
        run: |
          mkdir -p android/app/libs/arm64-v8a
          : > missing-libs.txt
          for n in libmain libSDL3 libSDL3_image libopenal libgamespy libdxvk_d3d8 libdxvk_d3d9; do
            f=$(find engine/build dxvk-src/build -name "$n.so" 2>/dev/null | head -n1 || true)
            if [ -n "$f" ]; then cp -L "$f" android/app/libs/arm64-v8a/ && echo "OK      $n"
            else echo "MISSING $n" | tee -a missing-libs.txt; fi
          done
          test -f android/app/libs/arm64-v8a/libmain.so

      - name: Assemble APK (tanpa data game)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-tanpa-data
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: |
            android/app/libs/arm64-v8a/*.so
            missing-libs.txt
